<style>

.core b:nth-child(2){inset:18px;animation-duration:6s;animation-direction:reverse;border-top-color:var(--accent2);border-bottom-color:var(--accent)}

.ask{position:fixed;left:calc(240px + 24px);right:24px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:832px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;z-index:6}

.fl{display:flex;gap:8px;flex-wrap:wrap;margin:0 4px 16px}.fl button{font:inherit;font-size:13px;cursor:pointer;color:var(--muted);background:var(--glass2);border:1px solid var(--line);border-radius:99px;padding:4px 14px}.fl button.on{color:var(--text);border-color:var(--accent);box-shadow:0 0 14px var(--glow)}
.cap{counter-reset:c}.cap .glass{padding:16px}.cap .glass::before{counter-increment:c;content:counter(c,decimal-leading-zero);color:var(--accent);font-size:12px;letter-spacing:.2em;display:block;margin-bottom:6px}.cap h3{font-size:15px;margin:0 0 4px;color:var(--text)}.cap p{font-size:13px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}.ask:focus-within{box-shadow:0 0 0 2px var(--accent),0 10px 36px var(--sh)}
@media (max-width:820px){
.side{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));left:auto;bottom:auto;width:auto;margin:8px 12px 0;flex-direction:row;align-items:center;padding:8px;overflow-x:auto;gap:4px}

main{margin-left:0;padding:16px 12px 110px}.ask{left:12px;right:12px}.hero{padding:24px}.core{width:130px;height:130px}.core s{inset:52px}.core b:nth-child(2){inset:14px}.core b:nth-child(3){inset:30px}}
@media (prefers-reduced-motion:reduce){.core b{animation-duration:60s}.core b:nth-child(2){animation-duration:45s}.core b:nth-child(3){animation-duration:30s}.core s{animation-duration:7s}}
</style>

<script>

{t:"Arayüzün baştan tasarlanması",s:"dev",d:"Koyu, premium bir masaüstü arayüz: merkezde Atom Core görselleştirmesi, solda gezinme paneli, altta “ISAC’a Sor” giriş alanı.",l:"Yedekte Atom Core bileşeni eksikmiş ve uygulama onsuz çalışıyormuş. Bir yedeğin açılması, tam olduğu anlamına gelmiyor."},

];

var ROUTES={
ana:function(){return '<section class="hero glass"><div class="core"><b></b><b></b><b></b><s></s></div><div class="ht"><p class="kick">Bora Okan Gökşen · ISAC</p><h1>Kendi yapay zekâ asistanımı inşa ediyorum.</h1><p class="lead">ISAC, yalnızca komutları yerine getirmenin ötesine geçmeyi hedefleyen kişisel bir yapay zekâ projesi. Bu site onun yapım günlüğü.</p><a class="btn" href="#isac">ISAC’ı keşfet</a><a class="btn alt" href="#gunluk">Günlüğü oku</a></div></section><h2>ISAC nasıl çalışır?</h2><div class="flow"><div class="glass"><h3>Komut</h3><p>Yazarak ya da sesle bir istek iletilir.</p></div><div class="glass"><h3>Anlama</h3><p>ISAC ne istendiğini ve hangi bağlamda olduğunu kavrar.</p></div><div class="glass"><h3>Modül</h3><p>İşe uygun modül devreye girer.</p></div><div class="glass"><h3>Sonuç</h3><p>Cevap ekranda net biçimde sunulur.</p></div></div><h2>Modüller</h2><div class="chips" style="margin:0 4px"><span class="chip">Özel alan modülleri</span><span class="chip">İçerikleri gizli</span><span class="chip">Yeni modüller yolda</span></div><h2>Son günlük kayıtları</h2>'+logHtml(2)+'<p style="margin:10px 4px"><a href="#gunluk">Tüm günlük →</a></p>'},

isac:function(){return '<section class="hero glass"><div class="core"><b></b><b></b><b></b><s></s></div><div class="ht"><p class="kick">Proje</p><h1>ISAC</h1><p class="lead">ISAC, kişisel bir fikirden doğan ve zamanla kapsamı genişleyen bir yapay zekâ projesidir.</p></div></section><section class="post glass"><p>Amacım, yalnızca verilen komutları yerine getiren bir asistan oluşturmak değil; çevresini anlayabilen, gelişmeleri takip edebilen, farklı durumları değerlendirebilen, karar süreçlerine katkı sağlayabilen ve kendi sistem bütünlüğünü koruyabilen daha bağımsız bir yapı geliştirmek.</p><p>ISAC benim için yalnızca üzerinde çalıştığım bir yazılım değil. Merak ettiğim, sorguladığım ve sınırlarını sürekli genişletmek istediğim bir fikrin somut hâli. Başlangıçta kişisel ihtiyaçlarıma yönelik bir asistan geliştirme düşüncesiyle ortaya çıktı. Ancak zamanla bu düşünce, çok daha kapsamlı ve farklı yetenekleri bir araya getiren bir teknoloji projesine dönüştü.</p><p>Teknolojiye yaklaşımımda hazır olanla yetinmekten ziyade, nasıl çalıştığını anlamak ve daha iyisinin nasıl yapılabileceğini keşfetmek önemli bir yer tutuyor. Bir fikri yalnızca hayal etmekle yetinmeyi sevmiyorum. Onu araştırmak, parçalarına ayırmak, farklı ihtimalleri değerlendirmek ve kendi bakış açıma göre yeniden şekillendirmek istiyorum.</p><p>Bu süreçte her şeyin ilk denemede kusursuz olmasını beklemiyorum. Bazen bir yaklaşımı değiştirmek, bazen en başa dönmek, bazen de daha önce doğru olduğunu düşündüğüm bir fikri yeniden sorgulamak gerekiyor. Benim için bunların her biri gelişimin bir parçası. Önemli olan karşılaşılan sorunlarda takılı kalmak değil, onlardan yeni bir şey öğrenerek ilerleyebilmek.</p><p>ISAC da bu anlayışla sürekli gelişen, değişen ve yeni hedeflerle şekillenen bir proje. Onu yalnızca bugünkü yetenekleriyle değil, zaman içerisinde ulaşabileceği potansiyelle değerlendiriyorum. Her yeni fikir, her deneme ve karşılaştığım her problem bu yolculuğun bir parçası.</p><p style="color:var(--accent);font-weight:600;margin:0">Henüz yolun başında olsam da hedefim oldukça net: Hayal ettiğim sistemi adım adım gerçeğe dönüştürmek.</p></section><h2>Neler yapıyor?</h2><div class="grid"><div class="glass"><h3>Atom Core arayüz</h3><p>Merkezde canlı görselleştirme olan koyu, cam efektli masaüstü tasarım.</p></div><div class="glass"><h3>Sesle ve yazıyla</h3><p>“ISAC’a Sor” alanı üzerinden istediğin biçimde komut ver.</p></div><div class="glass"><h3>Modüler mimari</h3><p>Her yetenek ayrı modül; yenisi tüm sistemi bozmadan eklenir.</p></div><div class="glass"><h3>Doğrulama hattı</h3><p>Derleme, doğrulama betiği ve regresyon testleri.</p></div><div class="glass"><h3>Güvenli geliştirme</h3><p>Yedek al, küçük değişiklik yap, test et, doğrula.</p></div><div class="glass"><h3>Dürüst raporlama</h3><p>Yapılan, test edilen ve eksik kalan her raporda açıkça yazılır.</p></div></div><div class="note">Modüllerin adı ve içeriği bilinçli olarak gizli tutuluyor; burada yalnızca genel yetenekler anlatılıyor.</div><section class="post glass"><p class="kick">ISAC’ın vizyonu</p><p style="font-size:19px;color:var(--text);margin:0">ISAC, yalnızca komutları yerine getiren bir yapay zekâ değil; çevresini gözlemleyen, durumları anlayan, riskleri değerlendiren, karar süreçlerine katkıda bulunan ve kendi sürekliliğini koruyabilen kişisel bir dijital asistandır.</p></section><h2>Temel yetenekler</h2>'+capHtml()+'<div class="note">ISAC aktif geliştirme aşamasında; bu yeteneklerin tümü üzerinde çalışmalar devam ediyor. İlerleme ve test sonuçları <a href="#gunluk">geliştirme günlüğünde</a> açıkça paylaşılıyor.</div><h2>Geliştirme günlüğü</h2>'+logHtml(3)+'<p style="margin:10px 4px"><a href="#gunluk">Tüm günlük →</a></p>'},
gunluk:function(){return '<h2>Geliştirme günlüğü</h2><p class="lead" style="margin:0 4px 16px">ISAC’ın yapım sürecinden kayıtlar: ne yapıldı, ne öğrenildi, ne henüz eksik.</p>'+filt()+logHtml()},
hakkimda:function(){return '<section class="post glass"><p class="kick">Hakkımda · Bora Okan Gökşen</p><h1>Kendi yolunu çizmeyi seçmiş, merak ettiklerinin peşinden gitmekten ve fikirlerini gerçeğe dönüştürmekten vazgeçmeyen biriyim.</h1><p>Teknolojiye ve yazılıma olan ilgim, zamanla yalnızca yeni şeyler öğrenmenin ötesine geçti. Kullandığım sistemlerin nasıl çalıştığını anlamak, mevcut sınırları sorgulamak ve kendi ihtiyaçlarıma yönelik çözümler geliştirmek en büyük motivasyonlarımdan biri hâline geldi.</p><p>Bu yaklaşımın en önemli yansıması ise ISAC.</p><p>ISAC, kişisel bir asistan fikrinden doğan, ancak zamanla çok daha geniş bir vizyona dönüşen özel bir yapay zekâ projesi. Yalnızca bilgi sunan veya komutları yerine getiren bir sistem olmanın ötesinde; çevresini anlayabilen, farklı süreçleri bir arada değerlendirebilen, gelişmeleri takip edebilen ve gerektiğinde kendi inisiyatifiyle harekete geçebilen bir dijital yapı oluşturmayı hedefliyor.</p><p>Benim için ISAC’ın asıl değeri, sahip olduğu özelliklerden çok, zaman içerisinde dönüşebilecek potansiyelinde yatıyor. Onu sürekli geliştirilen, denetlenen ve yeni yetenekler kazandırılan uzun soluklu bir proje olarak görüyorum.</p><div class="note">Bu blogda geliştirme sürecinin izlerini, teknolojiye dair düşüncelerimi, üzerinde çalıştığım fikirleri ve bu yolculukta edindiğim deneyimleri paylaşacağım.</div><p>Henüz tamamlanmış bir hikâyenin değil, devam eden bir yolculuğun içerisindeyim.</p><p style="color:var(--accent);font-weight:600;margin:0">Kendi yolumu çizdim, hâlâ keşfediyorum.</p></section>'}
};
function render(){
var h=(location.hash||"#ana").slice(1),app=document.getElementById("app"),p=null;
for(var i=0;i<POSTS.length;i++){if(POSTS[i].id===h)p=POSTS[i]}
if(p){app.innerHTML='<article class="post glass"><p><a href="#yazilar">← Yazılar</a></p><div class="meta">'+p.date+'<span class="tag">Taslak</span></div><h1>'+p.t+'</h1>'+p.b+'</article>';h="yazilar"}
else{app.innerHTML=(ROUTES[h]||ROUTES.ana)()}
var ls=document.querySelectorAll(".side a.nv");
for(var j=0;j<ls.length;j++){var on=ls[j].getAttribute("data-r")===h;ls[j].className="nv"+(on?" on":"");if(on){ls[j].setAttribute("aria-current","page")}else{ls[j].removeAttribute("aria-current")}}}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0)});
var qi=document.getElementById("q");
qi.addEventListener("input",function(){Q=qi.value;if(location.hash!=="#gunluk"){location.hash="#gunluk"}else{render()}});
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qi){e.preventDefault();qi.focus()}});
document.getElementById("yr").textContent=new Date().getFullYear();
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-f]");if(b){GF=b.getAttribute("data-f");render()}});
document.getElementById("tm").onclick=function(){
var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark";
r.setAttribute("data-theme",dark?"light":"dark")};
render();
