<style>
:root{--bg:#f6f6f9;--surface:#fff;--surface2:#f0eff6;--line:#e4e2ec;--line2:#cfccdd;--text:#16131f;--muted:#575369;--accent:#5b34c9;--accent2:#7b4df0;--soft:rgba(91,52,201,.08);--glow:rgba(124,77,255,.18);--btn:#5b34c9;--onbtn:#fff;--hdr:rgba(246,246,249,.84);--sh:0 1px 2px rgba(22,19,31,.05),0 12px 32px -14px rgba(22,19,31,.14);color-scheme:light}
:root[data-theme="dark"]{--bg:#0a0812;--surface:#131021;--surface2:#1a1630;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);--text:#ecebf5;--muted:#a6a2bd;--accent:#b49cff;--accent2:#8b5cf6;--soft:rgba(167,139,250,.13);--glow:rgba(139,92,246,.30);--btn:#a78bfa;--onbtn:#0d0820;--hdr:rgba(10,8,18,.82);--sh:0 1px 2px rgba(0,0,0,.4),0 16px 40px -16px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.65 "Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 42% at 88% -6%,var(--glow),transparent 70%)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
.top{position:sticky;top:0;z-index:20;background:var(--hdr);-webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1120px;margin:0 auto;padding:0 24px;min-height:64px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand small{font-weight:500;font-size:13px;color:var(--muted);padding-left:10px;border-left:1px solid var(--line2);letter-spacing:0}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 0 0 4px var(--soft)}
.nav{display:flex;gap:4px;margin-right:auto}
.nav a.nv{padding:8px 14px;border-radius:9px;color:var(--muted);font-size:15px;font-weight:500;transition:color .15s,background .15s}
.nav a.nv:hover{color:var(--text);background:var(--soft);text-decoration:none}
.nav a.nv.on{color:var(--text);background:var(--soft);font-weight:600}
.tools{display:flex;align-items:center;gap:10px}
.srch{display:flex;align-items:center;gap:8px;width:240px;height:38px;padding:0 10px 0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--muted);transition:border-color .15s,box-shadow .15s}
.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.srch svg{flex:none}
.srch input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:14px}
.srch input::placeholder{color:var(--muted)}
.srch kbd{font:inherit;font-size:11px;border:1px solid var(--line2);border-radius:6px;padding:1px 7px;color:var(--muted)}
button.t{width:38px;height:38px;display:grid;place-items:center;padding:0;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
button.t:hover{color:var(--text);border-color:var(--accent)}
main{max-width:1120px;margin:0 auto;padding:48px 24px 72px}
h1{font-size:clamp(32px,4.6vw,48px);line-height:1.1;margin:0 0 16px;letter-spacing:-.03em;font-weight:700;text-wrap:balance}
h2{font-size:22px;line-height:1.3;letter-spacing:-.015em;font-weight:650;margin:64px 0 20px}
.lead{color:var(--muted);font-size:18px;line-height:1.65;margin:0;max-width:56ch}
.kick{font-size:13px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;font-weight:600;margin:0 0 14px}
.glass{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:center;padding:8px 0 0;margin-bottom:56px}
.ht{min-width:0}
.hero .face{order:2}
.face{position:relative;width:100%;max-width:400px;justify-self:end;margin:0;aspect-ratio:464/559;border-radius:22px;overflow:hidden;border:1px solid var(--line2);box-shadow:0 0 0 1px var(--soft),0 36px 90px -34px var(--glow),var(--sh)}
.face img{display:block;width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;padding:11px 20px;border-radius:10px;background:var(--btn);color:var(--onbtn);font-weight:600;font-size:15px;border:1px solid transparent;margin:26px 12px 0 0;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{text-decoration:none;transform:translateY(-1px);box-shadow:0 10px 26px -10px var(--glow)}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.alt:hover{background:var(--soft);box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:13.5px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);margin-bottom:4px}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:1px 11px;font-size:12px;font-weight:500;margin-left:8px;color:var(--accent);background:var(--soft)}
.tag.st{color:var(--c)}
:root[data-theme="dark"] .tag.st{color:var(--cd)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr));gap:16px}
.grid .glass{padding:20px 22px}
.grid h3{margin:0 0 6px;font-size:16px;font-weight:650}
.grid p{margin:0;font-size:14.5px;color:var(--muted)}
.post{padding:36px 40px;max-width:820px}
.post p{margin:0 0 16px;max-width:68ch;font-size:17px;line-height:1.8}
.post p.kick{font-size:13px;line-height:1.4;max-width:none}
.post h1{font-size:clamp(24px,3vw,32px);line-height:1.25;max-width:34ch;margin-bottom:22px}
.note{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);padding:14px 18px;border-radius:12px;color:var(--muted);font-size:15px;margin:24px 0}
.empty{padding:28px;color:var(--muted);text-align:center}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;counter-reset:s}
.flow .glass{padding:20px 22px}
.flow .glass::before{counter-increment:s;content:"0" counter(s);color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.12em;display:block;margin-bottom:12px;font-variant-numeric:tabular-nums}
.flow h3{margin:0 0 6px;font-size:17px;font-weight:650}
.flow p{margin:0;font-size:14.5px;color:var(--muted)}
.cap{counter-reset:c}
.cap .glass::before{counter-increment:c;content:counter(c,decimal-leading-zero);color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.12em;display:block;margin-bottom:8px;font-variant-numeric:tabular-nums}
.cap h3{font-size:16px}
.cap p{font-size:14px}
.tl{position:relative;padding-left:28px}
.tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--line2)}
.ti{position:relative;padding:22px 24px;margin:0 0 16px}
.ti::before{content:"";position:absolute;left:-27px;top:28px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.ti h3{margin:6px 0 8px;font-size:18px;font-weight:650;line-height:1.35}
.ti p{margin:0 0 8px;font-size:15px;color:var(--muted)}
.ti .lrn{color:var(--text);border-top:1px solid var(--line);padding-top:12px;margin:12px 0 0}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.fl button{font:inherit;font-size:14px;cursor:pointer;color:var(--muted);background:var(--surface);border:1px solid var(--line2);border-radius:99px;padding:5px 16px}
.fl button.on{color:var(--text);border-color:var(--accent);background:var(--soft)}
footer{margin-top:72px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.srch input:focus-visible{outline:none}
@media (max-width:1000px){
.brand small{display:none}
.srch{width:190px}
.srch kbd{display:none}
}
@media (max-width:900px){
.hero{grid-template-columns:1fr;gap:32px}
.hero .face{justify-self:start;max-width:320px}
}
@media (max-width:760px){
.top-in{flex-wrap:wrap;gap:8px 12px;padding:10px 16px}
.tools{display:contents}
.brand{order:1}
button.t{order:2;margin-left:auto}
.nav{order:3;width:100%;margin-right:0;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.srch{order:4;width:100%}
main{padding:28px 16px 56px}
h2{margin:48px 0 16px}
.post{padding:24px 20px}
.ti{padding:18px 18px}
}
#app{view-transition-name:page}
.top{view-transition-name:hdr}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(page){animation:vt-out .64s cubic-bezier(.65,0,.35,1) both}
::view-transition-new(page){animation:vt-in .64s cubic-bezier(.65,0,.35,1) both}
@keyframes vt-out{to{opacity:.25;filter:blur(3px) saturate(1.4)}}
@keyframes vt-in{from{clip-path:inset(0 100% 0 0);filter:blur(7px) brightness(1.5)}to{clip-path:inset(0 0 0 0);filter:none}}
.scan{position:fixed;top:0;bottom:0;width:2px;margin-left:-1px;z-index:50;pointer-events:none;background:linear-gradient(transparent,var(--accent2) 18%,var(--accent) 50%,var(--accent2) 82%,transparent);box-shadow:0 0 18px 3px var(--accent2),-60px 0 90px 10px var(--glow)}
.scan::before{content:"";position:absolute;right:2px;top:0;bottom:0;width:240px;background:linear-gradient(90deg,transparent,var(--glow));-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.scan::after{content:"";position:absolute;right:2px;top:0;bottom:0;width:240px;opacity:.16;background:linear-gradient(var(--accent2) 1px,transparent 1px) 0 0/100% 28px,linear-gradient(90deg,var(--accent2) 1px,transparent 1px) 0 0/28px 100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000);mask-image:linear-gradient(90deg,transparent,#000)}
.top::after{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:calc(var(--p,0)*100%);background:linear-gradient(90deg,var(--accent2),var(--accent))}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}.enter>*:nth-child(n+6){animation-delay:.3s}
.grid .glass,.flow .glass,.ti{transition:border-color .2s,transform .2s,box-shadow .2s}
.grid .glass:hover,.flow .glass:hover,.ti:hover{border-color:var(--line2);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.enter>*{animation:none}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>

{t:"Yeni sürüm derlendi ve kuruldu",s:"dev",d:"13 Kasım’da yeni sürümü derleyip kurdum. 345 testin tamamı geçti, gizli bilgi taraması temiz çıktı. Eski sürümü geri dönüş için sakladım.",l:"Kurulan sürümde ekran okumanın gerçek kullanımda çalıştığını henüz görmedim; bunu ayrıca denemem gerekiyor."},
{t:"Aynı anda tek ekran işlemi",s:"dev",d:"Tek fare ve klavye olduğu için ISAC iki ekran işlemini aynı anda yürütmüyor. İkinci işlem hiçbir şey göndermeden reddediliyor.",l:"Bu koruma farklı işlem parçacıkları arasında çalışıyor; aynı parçacık içindeki iç içe onay pencereleri için sınırlı. Bunu testlerle doğruladım, gerçek bir portalda iki işi aynı anda denemedim."},
{t:"Ekran okuma, gizlilik korumalı",s:"dev",d:"ISAC artık istediğimde ekranda ne olduğunu okuyup özetleyebiliyor. Kimlik numaraları maskeleniyor, istersem okuduklarını unutuyor, yalnızca izin verdiğim pencereye bakıyor.",l:"Gerçek bir test penceresinde yazdığım komutla Türkçe metin ve tablo birkaç saniyede okundu. Gerçek bir portal ve gerçek mikrofonla henüz denemedim."},
{t:"ISAC Evolve: çekirdek görseli baş figürüyle değişti",s:"dev",d:"Ana ekrandaki reaktör çekirdeğinin (Atom Core) yerine parçacıklardan oluşan, insan formuna yaklaştırmaya çalıştığım bir baş figürü geldi. Arka plan da koyu mor-lacivert bir zemin, ince bir ızgara ve mor tonlu veri akışlarıyla yeniden çizildi; arayüz artık ISAC Evolve adını taşıyor.",l:"Görsel bir yenilik yalnızca çizimle bitmiyor; figürün noktalarını hesaplamak açılışı uzatabileceği için hesap arka planda yapılıp sonuç saklanıyor, kapanışta ara sıra çıkan bir yarış durumunu da testler yakaladı. Yüz ve boyun artık yumuşak, tek bir yüzey gibi çiziliyor; saç, göz küreleri ve devre izleri hâlâ nokta ve çizgi. Alında küçük boşluklar, boyunda tırtıklı bir kenar ve silik bir ağız çizgisi var; cilalı görünüme henüz ulaşmadım. Bunları testlerle ve ekran dışı çizimle doğruladım."},
{t:"Arayüzün baştan tasarlanması",s:"dev",d:"İlk sürümde koyu, premium bir masaüstü arayüz vardı: merkezde Atom Core görselleştirmesi, solda gezinme paneli, altta “ISAC’a Sor” giriş alanı. Merkezdeki görsel sonradan ISAC Evolve baş figürüyle değişti.",l:"Yedekte Atom Core bileşeni eksikmiş ve uygulama onsuz çalışıyormuş. Bir yedeğin açılması, tam olduğu anlamına gelmiyor."},
{t:"Çalışma düzeni: yedek, küçük değişiklik, test, rapor",s:"dev",d:"Her değişiklikten önce yedek alınıyor, değişiklik küçük ve izole tutuluyor, ardından test ediliyor.",l:"Yapılmayan bir iş “tamamlandı” diye raporlanmaz; eksikler her raporda açıkça yazılır."},
{t:"Otomatik doğrulama araçları",s:"dev",d:"Kod; derleme, doğrulama betiği ve regresyon testlerinden geçiriliyor. Arayüzden bağımsız kontroller başarıyla doğrulandı.",l:"Arayüz kütüphanesi gerektiren kontroller ancak kendi bilgisayarımda doğrulanabiliyor."},
{t:"Modüllerin gerçek senaryolarla testi",s:"dev",d:"Bazı modüller eklendi; gerçek kullanım senaryolarıyla testleri henüz tamamlanmadı.",l:""}

function fold(s){return s.replace(/İ/g,"i").replace(/I/g,"i").replace(/ı/g,"i").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function capHtml(){return '<div class="grid cap">'+CAP.map(function(c){return '<div class="glass"><h3>'+c[0]+'</h3><p>'+c[1]+'</p><span class="tag" style="margin:10px 0 0;color:var(--accent)">Devam ediyor</span></div>'}).join('')+'</div>'}
function logHtml(n){var a=n?LOG.slice(0,n):LOG.filter(function(x){var q=fold(Q);return (GF==="all"||x.s===GF)&&(!q||fold(x.t+" "+x.d+" "+x.l).indexOf(q)>-1)});
if(!a.length)return '<div class="empty glass">'+(Q?'Aramanla eşleşen kayıt yok.':'Bu durumda kayıt yok.')+'</div>';
return '<div class="tl">'+a.map(function(x){var s=ST[x.s];return '<div class="ti glass"><div class="meta"><span class="tag st" style="margin:0;--c:'+s[1]+';--cd:'+s[2]+'">'+s[0]+'</span></div><h3>'+x.t+'</h3><p>'+x.d+'</p>'+(x.l?'<p class="lrn"><b>Öğrendim:</b> '+x.l+'</p>':'')+'</div>'}).join('')+'</div>'}
function filt(){var u={};LOG.forEach(function(x){u[x.s]=1});if(Object.keys(u).length<2)return '';var k=[["all","Tümü"]];for(var s in u){k.push([s,ST[s][0]])}
return '<div class="fl">'+k.map(function(x){return '<button data-f="'+x[0]+'" class="'+(GF===x[0]?'on':'')+'">'+x[1]+'</button>'}).join('')+'</div>'}
var Q="";
function list(){var q=fold(Q),r=POSTS.filter(function(p){return !q||fold(p.t+" "+p.d).indexOf(q)>-1});
return r.length?r.map(function(p){return '<a class="card glass" href="#'+p.id+'"><div class="meta">'+p.date+'<span class="tag">Taslak</span></div><h3>'+p.t+'</h3><p>'+p.d+'</p></a>'}).join(''):'<div class="empty glass">Sonuç bulunamadı.</div>'}
var ROUTES={
ana:function(){return '<section class="hero">'+FACE+'<div class="ht"><p class="kick">Bora Okan Gökşen · ISAC</p><h1>Kendi yapay zekâ asistanımı inşa ediyorum.</h1><p class="lead">ISAC, yalnızca komutları yerine getirmenin ötesine geçmeyi hedefleyen kişisel bir yapay zekâ projesi. Bu site onun yapım günlüğü.</p><a class="btn" href="#isac">ISAC’ı keşfet</a><a class="btn alt" href="#gunluk">Günlüğü oku</a></div></section><h2>ISAC nasıl çalışır?</h2><div class="flow"><div class="glass"><h3>Komut</h3><p>Yazarak ya da sesle bir istek iletilir.</p></div><div class="glass"><h3>Anlama</h3><p>ISAC ne istendiğini ve hangi bağlamda olduğunu kavrar.</p></div><div class="glass"><h3>Modül</h3><p>İşe uygun modül devreye girer.</p></div><div class="glass"><h3>Sonuç</h3><p>Cevap ekranda net biçimde sunulur.</p></div></div><h2>Modüller</h2><div class="chips"><span class="chip">Özel alan modülleri</span><span class="chip">İçerikleri gizli</span><span class="chip">Yeni modüller yolda</span></div><h2>Son günlük kayıtları</h2>'+logHtml(2)+'<p style="margin:18px 0 0"><a href="#gunluk">Tüm günlük →</a></p>'},
yazilar:function(){return '<h2>Tüm yazılar</h2>'+list()},
isac:function(){return '<section class="hero">'+FACE+'<div class="ht"><p class="kick">Proje</p><h1>ISAC</h1><p class="lead">ISAC, kişisel bir fikirden doğan ve zamanla kapsamı genişleyen bir yapay zekâ projesidir.</p></div></section><section class="post glass"><p>Amacım, yalnızca verilen komutları yerine getiren bir asistan oluşturmak değil; çevresini anlayabilen, gelişmeleri takip edebilen, farklı durumları değerlendirebilen, karar süreçlerine katkı sağlayabilen ve kendi sistem bütünlüğünü koruyabilen daha bağımsız bir yapı geliştirmek.</p><p>ISAC benim için yalnızca üzerinde çalıştığım bir yazılım değil. Merak ettiğim, sorguladığım ve sınırlarını sürekli genişletmek istediğim bir fikrin somut hâli. Başlangıçta kişisel ihtiyaçlarıma yönelik bir asistan geliştirme düşüncesiyle ortaya çıktı. Ancak zamanla bu düşünce, çok daha kapsamlı ve farklı yetenekleri bir araya getiren bir teknoloji projesine dönüştü.</p><p>Teknolojiye yaklaşımımda hazır olanla yetinmekten ziyade, nasıl çalıştığını anlamak ve daha iyisinin nasıl yapılabileceğini keşfetmek önemli bir yer tutuyor. Bir fikri yalnızca hayal etmekle yetinmeyi sevmiyorum. Onu araştırmak, parçalarına ayırmak, farklı ihtimalleri değerlendirmek ve kendi bakış açıma göre yeniden şekillendirmek istiyorum.</p><p>Bu süreçte her şeyin ilk denemede kusursuz olmasını beklemiyorum. Bazen bir yaklaşımı değiştirmek, bazen en başa dönmek, bazen de daha önce doğru olduğunu düşündüğüm bir fikri yeniden sorgulamak gerekiyor. Benim için bunların her biri gelişimin bir parçası. Önemli olan karşılaşılan sorunlarda takılı kalmak değil, onlardan yeni bir şey öğrenerek ilerleyebilmek.</p><p>ISAC da bu anlayışla sürekli gelişen, değişen ve yeni hedeflerle şekillenen bir proje. Onu yalnızca bugünkü yetenekleriyle değil, zaman içerisinde ulaşabileceği potansiyelle değerlendiriyorum. Her yeni fikir, her deneme ve karşılaştığım her problem bu yolculuğun bir parçası.</p><p style="color:var(--accent);font-weight:600;margin:0">Henüz yolun başında olsam da hedefim oldukça net: Hayal ettiğim sistemi adım adım gerçeğe dönüştürmek.</p></section><h2>Neler yapıyor?</h2><div class="grid"><div class="glass"><h3>ISAC Evolve arayüz</h3><p>Parçacıklardan oluşan bir baş figürü, koyu zemin ve cam efektli kartlarla masaüstü tasarım.</p></div><div class="glass"><h3>Sesle ve yazıyla</h3><p>“ISAC’a Sor” alanı üzerinden istediğin biçimde komut ver.</p></div><div class="glass"><h3>Modüler mimari</h3><p>Her yetenek ayrı modül; yenisi tüm sistemi bozmadan eklenir.</p></div><div class="glass"><h3>Doğrulama hattı</h3><p>Derleme, doğrulama betiği ve regresyon testleri.</p></div><div class="glass"><h3>Güvenli geliştirme</h3><p>Yedek al, küçük değişiklik yap, test et, doğrula.</p></div><div class="glass"><h3>Dürüst raporlama</h3><p>Yapılan, test edilen ve eksik kalan her raporda açıkça yazılır.</p></div></div><div class="note">Modüllerin adı ve içeriği bilinçli olarak gizli tutuluyor; burada yalnızca genel yetenekler anlatılıyor.</div><section class="post glass"><p class="kick">ISAC’ın vizyonu</p><p style="font-size:19px;color:var(--text);margin:0">ISAC, yalnızca komutları yerine getiren bir yapay zekâ değil; çevresini gözlemleyen, durumları anlayan, riskleri değerlendiren, karar süreçlerine katkıda bulunan ve kendi sürekliliğini koruyabilen kişisel bir dijital asistandır.</p></section><h2>Temel yetenekler</h2>'+capHtml()+'<div class="note">ISAC aktif geliştirme aşamasında; bu yeteneklerin tümü üzerinde çalışmalar devam ediyor. İlerleme ve test sonuçları <a href="#gunluk">geliştirme günlüğünde</a> açıkça paylaşılıyor.</div><h2>Geliştirme günlüğü</h2>'+logHtml(3)+'<p style="margin:18px 0 0"><a href="#gunluk">Tüm günlük →</a></p>'},
gunluk:function(){return '<h2>Geliştirme günlüğü</h2><p class="lead" style="margin:0 0 24px">ISAC’ın yapım sürecinden kayıtlar: ne yapıldı, ne öğrenildi, ne henüz eksik.</p>'+filt()+logHtml()},
hakkimda:function(){return '<section class="post glass"><p class="kick">Hakkımda · Bora Okan Gökşen</p><h1>Kendi yolunu çizmeyi seçmiş, merak ettiklerinin peşinden gitmekten ve fikirlerini gerçeğe dönüştürmekten vazgeçmeyen biriyim.</h1><p>Teknolojiye ve yazılıma olan ilgim, zamanla yalnızca yeni şeyler öğrenmenin ötesine geçti. Kullandığım sistemlerin nasıl çalıştığını anlamak, mevcut sınırları sorgulamak ve kendi ihtiyaçlarıma yönelik çözümler geliştirmek en büyük motivasyonlarımdan biri hâline geldi.</p><p>Bu yaklaşımın en önemli yansıması ise ISAC.</p><p>ISAC, kişisel bir asistan fikrinden doğan, ancak zamanla çok daha geniş bir vizyona dönüşen özel bir yapay zekâ projesi. Yalnızca bilgi sunan veya komutları yerine getiren bir sistem olmanın ötesinde; çevresini anlayabilen, farklı süreçleri bir arada değerlendirebilen, gelişmeleri takip edebilen ve gerektiğinde kendi inisiyatifiyle harekete geçebilen bir dijital yapı oluşturmayı hedefliyor.</p><p>Benim için ISAC’ın asıl değeri, sahip olduğu özelliklerden çok, zaman içerisinde dönüşebilecek potansiyelinde yatıyor. Onu sürekli geliştirilen, denetlenen ve yeni yetenekler kazandırılan uzun soluklu bir proje olarak görüyorum.</p><div class="note">Bu blogda geliştirme sürecinin izlerini, teknolojiye dair düşüncelerimi, üzerinde çalıştığım fikirleri ve bu yolculukta edindiğim deneyimleri paylaşacağım.</div><p>Henüz tamamlanmış bir hikâyenin değil, devam eden bir yolculuğun içerisindeyim.</p><p style="color:var(--accent);font-weight:600;margin:0">Kendi yolumu çizdim, hâlâ keşfediyorum.</p></section>'}
};
var TT={isac:"ISAC",gunluk:"Geliştirme Günlüğü",hakkimda:"Hakkımda",yazilar:"Yazılar"};
function paint(){
var h=(location.hash||"#ana").slice(1),app=document.getElementById("app"),p=null;
for(var i=0;i<POSTS.length;i++){if(POSTS[i].id===h)p=POSTS[i]}
var base="Bora Okan Gökşen — ISAC Geliştirme Günlüğü";
if(p){app.innerHTML='<article class="post glass"><p><a href="#yazilar">← Yazılar</a></p><div class="meta">'+p.date+'<span class="tag">Taslak</span></div><h1>'+p.t+'</h1>'+p.b+'</article>';document.title=p.t+" · "+base;h="yazilar"}
else{if(!Object.prototype.hasOwnProperty.call(ROUTES,h))h="ana";app.innerHTML=ROUTES[h]();document.title=TT[h]?TT[h]+" · "+base:base}
var ls=document.querySelectorAll(".top a.nv");
for(var j=0;j<ls.length;j++){var on=ls[j].getAttribute("data-r")===h;ls[j].className="nv"+(on?" on":"");if(on){ls[j].setAttribute("aria-current","page")}else{ls[j].removeAttribute("aria-current")}}}
var lastKey=null;
function render(nav){
var rm=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches,app=document.getElementById("app");
var key=location.hash||"#ana",prev=lastKey,change=nav&&key!==prev;lastKey=key;
var done=false;function go(){if(done)return;done=true;paint();if(nav)window.scrollTo(0,0)}
if(!change||rm){go();return}
if(document.startViewTransition&&prev!==null){var vt=document.startViewTransition(go);vt.ready.then(scan,function(){});setTimeout(go,900);return}
go();app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter");if(prev!==null)scan()}
function scan(){var a=document.getElementById("app").getBoundingClientRect(),s=document.createElement("div");s.className="scan";s.setAttribute("aria-hidden","true");s.style.left=a.left+"px";document.body.appendChild(s);
var an=s.animate([{transform:"translateX(0)",opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.9},{transform:"translateX("+a.width+"px)",opacity:0}],{duration:640,easing:"cubic-bezier(.65,0,.35,1)"});an.onfinish=an.oncancel=function(){s.remove()};setTimeout(function(){s.remove()},1500)}
window.addEventListener("hashchange",function(){render(true)});
var pgq=false;function prog(){pgq=false;var r=document.documentElement,m=r.scrollHeight-r.clientHeight;r.style.setProperty("--p",m>0?Math.min(1,Math.max(0,window.scrollY/m)):0)}
window.addEventListener("scroll",function(){if(!pgq){pgq=true;requestAnimationFrame(prog)}},{passive:true});window.addEventListener("resize",prog);
var qi=document.getElementById("q");
qi.addEventListener("input",function(){Q=qi.value;if(Q&&location.hash!=="#gunluk"){location.hash="#gunluk"}else{render()}});
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==qi&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();qi.focus()}else if(e.key==="Escape"&&document.activeElement===qi){e.preventDefault();qi.blur()}});
document.getElementById("yr").textContent=new Date().getFullYear();
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-f]");if(b){GF=b.getAttribute("data-f");render()}});
var tmb=document.getElementById("tm");
function setTheme(t){document.documentElement.setAttribute("data-theme",t);tmb.setAttribute("aria-pressed",t==="dark"?"true":"false");
var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="dark"?"#0a0812":"#f6f6f9")}
setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light");
tmb.onclick=function(){var t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";setTheme(t);try{localStorage.setItem("theme",t)}catch(e){}};
render(true);
</script>
